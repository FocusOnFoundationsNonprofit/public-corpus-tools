ring matching).\n    :return: int, the total number of replacements made.", "x": 900, "y": 200}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.parse_csv_for_find_replace", "label": "parse_csv_for_find_replace", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "FIND AND REPLACE", "title": "def parse_csv_for_find_replace(csv_file):\n\nParses a CSV file to extract find and replace pairs.\n    Handles two formats for find/replace pairs:\n    1. Unquoted strings: Leading and trailing spaces are stripped\n    2. Single-quoted strings (\u0027): Preserves all spaces between the quotes\n    \n    Example CSV content:\n    find, replace\n    hello  ,  world     # -\u003e (\u0027hello\u0027, \u0027world\u0027)\n    \u0027hello  \u0027, \u0027world \u0027 # -\u003e (\u0027hello  \u0027, \u0027world \u0027)\n    \n    :param csv_file: string, path to the CSV file containing find/replace pairs.\n    :return: list of tuples, each containing (find_string, replace_string).", "x": 900, "y": 250}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.process_find_replace_pair", "label": "process_find_replace_pair", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "FIND AND REPLACE", "title": "def process_find_replace_pair(find_str, replace_str):\n\nHelper function to process a find/replace pair based on whether they use quotes.\n    Both strings must use the same format (either both quoted or both unquoted).\n    \n    :param find_str: string, the string to find.\n    :param replace_str: string, the string to replace with.\n    :return: tuple of (processed_find_str, processed_replace_str).\n    :raises ValueError: if one string is quoted and the other isn\u0027t.", "x": 900, "y": 300}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.find_and_replace_from_csv", "label": "find_and_replace_from_csv", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "FIND AND REPLACE", "title": "def find_and_replace_from_csv(folder_path, find_replace_csv, suffixpat_include=None, include_subfolders=False, verbose=False):\n\nApplies find and replace operations on all files in a specified folder based on pairs defined in a CSV file.\n    Overwrite is fixed at \u0027yes\u0027 so you have to copy the files before running.\n    IMPORTANT csv file cannot be in the same folder if suffixpat_include=None\n    Good practice is to always include a suffixpat_include even if those are the only type of file in the folder.\n\n    :param folder_path: string, the path to the folder where the files are located.\n    :param find_replace_csv: string, the path to the CSV file containing find and replace pairs.\n    :param suffixpat_include: string, the suffix pattern that included files must have. If None, all files will be processed.\n    :param verbose: boolean, if True prints verbose messages.\n    :return: None", "x": 900, "y": 350}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "fileops.HEADINGS", "label": "HEADINGS", "module": "fileops.py", "shape": "box", "size": 30, "x": 900, "y": 400}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.get_heading_level", "label": "get_heading_level", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def get_heading_level(heading):\n\nDetermines the level of a markdown heading.\n\n    :param heading: string, the markdown heading including \u0027#\u0027 characters.\n    :return: int, the level of the heading.", "x": 900, "y": 450}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.get_heading_pattern", "label": "get_heading_pattern", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def get_heading_pattern(heading):\n\nCreates a regex pattern to match a heading and its content, including subheadings.\n\n    :param heading: string, the markdown heading including \u0027#\u0027 characters.\n    :return: compiled regex pattern or None if heading is empty", "x": 900, "y": 500}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.find_heading_text", "label": "find_heading_text", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def find_heading_text(full_text, heading):\n\nFinds the heading text, including its subheadings, inclusive of the heading itself.\n\n    :param text: string, the text to search in.\n    :param heading: string, the markdown heading to find.\n    :return: tuple (start_index, end_index) or None if not found.", "x": 900, "y": 550}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.get_heading", "label": "get_heading", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def get_heading(file_path, heading):\n\nExtracts the markdown heading and its associated text from a file, including any subheadings of equal or lower order.\n    Uses the complete text and does not parse the metadata and content sections.\n\n    :param file_path: string, the path to the file to be read.\n    :param heading: string, the markdown heading to be extracted, including the \u0027#\u0027 characters and the following space.\n    :return: string, the markdown heading and its associated text, including any subheadings of equal or lower order.", "x": 900, "y": 600}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.set_heading", "label": "set_heading", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def set_heading(file_path, new_text, heading):\n\nSets the heading and following text associated with a markdown heading and overwrites the file.\n    Replaces if the heading already exists. Adds if it does not exist.\n    New line characters must be included in the new_text (e.g., \u0027\\nHere\u0027s new text\\n\\n\u0027).\n    \n    :param file_path: string, the path to the file where the heading text will be set.\n    :param new_text: string, the new text to be associated with the markdown heading, inclusive of newlines.\n    :param heading: string, the markdown heading whose text will be set, including the \u0027#\u0027 characters and the following space.\n    :return: None", "x": 900, "y": 650}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.delete_heading", "label": "delete_heading", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def delete_heading(file_path, heading):\n\nDeletes the specified markdown heading and its following text, including subheadings, and overwrites the file.\n    If the heading does not exist, a warning is issued and no action is taken.\n\n    :param file_path: string of the path to the file from which the heading will be deleted.\n    :param heading: string of the markdown heading to be deleted, including the \u0027#\u0027 characters and the following space.", "x": 900, "y": 700}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.append_heading_to_file", "label": "append_heading_to_file", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def append_heading_to_file(source_file_path, target_file_path, heading, include_filename=True):\n\nAppends the text under a specified heading from a source file to a target file, optionally including the source filename as a heading.\n\n    :param source_file_path: string of the path to the source file.\n    :param target_file_path: string of the path to the target file where the text will be appended.\n    :param heading: string of the markdown heading to be appended.\n    :param include_filename: boolean indicating whether to include the source filename as a heading. Defaults to True.\n    :return: string of the appended text or None if the heading is not found in the source file.", "x": 900, "y": 750}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.create_new_file_from_heading", "label": "create_new_file_from_heading", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def create_new_file_from_heading(file_path, heading, suffix_new=\u0027_headingonly\u0027, remove_heading=False):\n\nExtracts text under a specified heading from a file and writes it to a new file with a specified suffix.\n\n    :param file_path: string of the path to the file.\n    :param heading: string of the markdown heading to be processed.\n    :param suffix_new: string of the suffix to be appended to the new file. Defaults to \u0027_headingonly\u0027.\n    :param remove_heading: boolean indicating whether to remove the heading from the extracted text. Defaults to False.\n    :return: string of the path to the newly created file.", "x": 900, "y": 800}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.delete_all_heading_instances", "label": "delete_all_heading_instances", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "HEADINGS", "title": "def delete_all_heading_instances(file_path, heading):\n\nDeletes all instances of the specified markdown heading and their following text, including subheadings.\n    Stops at headings of equal or higher level (fewer or same number of \u0027#\u0027 characters).\n\n    :param file_path: string, the path to the file from which the headings will be deleted.\n    :param heading: string, the markdown heading to be deleted, including the \u0027#\u0027 characters and the following space.", "x": 900, "y": 850}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "fileops.METADATA", "label": "METADATA", "module": "fileops.py", "shape": "box", "size": 30, "x": 900, "y": 900}, pdates the \u0027last updated\u0027 metadata field in a file with a new value.\n\n    :param file_path: string, the path to the file to be updated.\n    :param new_last_updated_value: string, the new value for the \u0027last updated\u0027 metadata field.\n    :param prepend_today: boolean, if True, today\u0027s date is prepended to the new_last_updated_value. Default is True.\n    :return: None", "x": 900, "y": 1100}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.read_metadata_field_from_file", "label": "read_metadata_field_from_file", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "METADATA", "title": "def read_metadata_field_from_file(file_path, field):\n\nReads a specific metadata field from a file.\n\n    :param file_path: string, the path to the file to be read.\n    :param field: string, the metadata field to be read from the file.\n    :return: tuple, the line number of the field and the value of the field.", "x": 900, "y": 1150}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.set_metadata_fields_from_csv", "label": "set_metadata_fields_from_csv", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "METADATA", "title": "def set_metadata_fields_from_csv(folder_path, csv_file_path, suffix_extension):\n\nSets metadata fields for all files in a folder based on a CSV file.\n\n    :param folder_path: string of the path to the folder containing the files.\n    :param csv_file_path: string of the path to the CSV file with metadata fields and values.\n    :param suffix_extension: string of the file extension to be appended to file bases.\n    :return: None, but prints the number of files processed successfully and the total in the CSV excluding empty rows.", "x": 900, "y": 1200}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.create_csv_from_fields", "label": "create_csv_from_fields", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "METADATA", "title": "def create_csv_from_fields(folder_path, fields):\n\nGenerates a CSV file of input fields from all markdown files in a folder.\n    Fields can be 2 formats, 1) generic, usually metadata (ending with a \u0027:\u0027) or 2) markdown headings (starting with a \u0027#\u0027).\n    Generic fields extract single-line values, while heading fields capture all content under the heading.\n\n    :param folder_path: string, the path to the folder containing the markdown files.\n    :param fields: list, the fields to be extracted from the markdown files.\n    :return: string of the path to the created csv file.", "x": 900, "y": 1250}, {"color": "#76b7b2", "font": {"size": 14}, "group": "function", "id": "fileops.create_csv_matrix_from_triples", "label": "create_csv_matrix_from_triples", "line": null, "module": "fileops.py", "shape": "box", "size": 40, "submodule": "METADATA", "title": "def create_csv_matrix_from_triples(triples_text, target_file_path):\n\nConverts multiline text of triples into a csv matrix file where each entry is the number for that row and column.\n\n    :param triples_text: string of multiline text containing rows of data separated by newlines, each row containing two strings and a number separated by commas.\n    :param target_file_path: string of the path to the target csv file.\n    :return: string of the path to the created csv file.", "x": 900, "y": 1300}, {"color": "#f28e2c", "font": {"size": 24}, "group": "module", "id": "transcribe.py", "label": "transcribe.py", "shape": "ellipse", "size": 60, "x": 1200, "y": 50}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "transcribe.YOUTUBE", "label": "YOUTUBE", "module": "transcribe.py", "shape": "box", "size": 30, "x": 1200, "y": 100}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.get_authenticated_service", "label": "get_authenticated_service", "line": null, "module": "transcribe. es the number to be excluded from conversion.\n    :param line_number: the current line number in the file being processed.\n    :param num_metadata_lines: the number of metadata lines in the file to adjust the actual line number.\n    :param printed_exceptions: a list of exception messages that have already been printed.\n    :param exception_type: the type of exception to be printed.\n    :param line: the current line of text being processed.\n    :return: None, but updates the printed_exceptions list with the new exception message if it hasn\u0027t been printed before.", "x": 1500, "y": 200}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.get_previous_word", "label": "get_previous_word", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def get_previous_word(substring, start_index):\n\nFinds the word in a string that precedes the given start index.\n\n    :param substring: the string from which to extract the previous word.\n    :param start_index: the index in the string to start searching backward from.\n    :return: the word found before the start index, or an empty string if no word is found.", "x": 1500, "y": 250}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.previous_word_exception", "label": "previous_word_exception", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def previous_word_exception(word, common_english_vocab, additional_exception_words):\n\nDetermines if a word is an exception based on its presence in additional exceptions or English vocabulary.\n\n    :param word: the word to check for exception status.\n    :param common_english_vocab: a set of common English words to compare against.\n    :param additional_exception_words: a set of words that are always considered exceptions.\n    :return: True if the word is an exception, False otherwise.", "x": 1500, "y": 300}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.convert_num_line_lowercase", "label": "convert_num_line_lowercase", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def convert_num_line_lowercase(line, num, num_str, line_number, num_metadata_lines, printed_exceptions, common_english_vocab):\n\nConverts numbers in a line of text to their lowercase word equivalents, skipping exceptions.\n\n    :param line: The line of text in which to convert numbers.\n    :param num: The numerical value to convert to words.\n    :param num_str: The string representation of the number to find in the line.\n    :param line_number: The current line number in the text being processed.\n    :param num_metadata_lines: The number of metadata lines in the text before the content.\n    :param printed_exceptions: A set to record exceptions that have been printed.\n    :param common_english_vocab: A set of common English vocabulary words.\n    :return: A tuple containing the modified line and the total number of substitutions made.", "x": 1500, "y": 350}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.convert_num_line_capitalization", "label": "convert_num_line_capitalization", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def convert_num_line_capitalization(line, num, num_str):\n\nCapitalize the numeral word at the beginning of a sentence or after punctuation.\n\n    :param line: the line of text in which to perform capitalization.\n    :param num: the numerical value to convert to words.\n    :param num_str: the string representation of the number to find in the line.\n    :return: a tuple containing the modified line and the total number of substitutions made.", "x": 1500, "y": 400}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.skip_speaker_line_with_timestamp", "label": "skip_speaker_line_with_timestamp", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def skip_speaker_line_with_timestamp(line):\n\nDetermine if a line contains a single timestamp with max_words before the timestamp less that get_timestamp default val (8) and is therefore a speaker line to skip.\n\n    :param line: The line of text to be checked for a timestamp.\n    :return: boolean where True if a timestamp is found, otherwise False.", "x": 1500, "y": 450}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.convert_num_lines", "label": "convert_num_lines", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def convert_num_lines(lines, num, num_str, num_metadata_lines, verbose, printed_exceptions):\n\nConverts numbers in lines of text to their word equivalents, handles capitalization, and skips lines with timestamps.\n    Takes both num and num_str as separate parameters to provide flexibility in how the function is called.\n    This design allows the caller to specify the string representation of the number 1 that should be searched for within the text lines,\n    which may not always be a straightforward string conversion of num.\n    For example, num could be an integer, but num_str could be a formatted string that represents the number\n    in a specific way within the text (e.g., \u0027001\u0027 instead of \u00271\u0027, or \u00271st\u0027 for the ordinal form).\n    \n    :param lines: list of text lines to process.\n    :param num: the numerical value to convert to words.\n    :param num_str: the string representation of the number to find in the lines.\n    :param num_metadata_lines: the number of metadata lines in the document to adjust line numbering for output.\n    :param verbose: boolean indicating whether to print the conversion output.\n    :param printed_exceptions: list to record any exceptions encountered during processing.\n    :return: tuple containing the list of processed lines and the total number of substitutions made.", "x": 1500, "y": 500}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.convert_numbers_in_content", "label": "convert_numbers_in_content", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def convert_numbers_in_content(content, num_limit, additional_numbers, num_metadata_lines, print_output):\n\nConverts numerical values in text content to their word equivalents, excluding lines with timestamps.\n\n    :param content: string containing the text content to be processed.\n    :param num_limit: integer representing the upper limit for numbers to convert.\n    :param additional_numbers: list of additional numbers to be converted outside the standard range.\n    :param num_metadata_lines: integer representing the number of metadata lines in the content.\n    :param print_output: boolean indicating whether to print the conversion output.\n    :return: tuple containing the converted content as a string and the total number of substitutions made.", "x": 1500, "y": 550}, {"color": "#f28e2c", "font": {"size": 14}, "group": "function", "id": "transcribe.convert_ordinals_in_content", "label": "convert_ordinals_in_content", "line": null, "module": "transcribe.py", "shape": "box", "size": 40, "submodule": "NUMERAL CONVERT", "title": "def convert_ordinals_in_content(content, punct_capitalization):\n\nConverts ordinal numbers in a string of text to their word equivalents and capitalizes words following specified punctuation.\n\n    :param content: string of text containing ordinal numbers and punctuation.\n    :param punct_capitalization: list of punctuation characters after which the following word should be capitalized.\n    :return: string of text with ordinal numbers converted and words capitalized as specified.", "x": 1500, "y": 6 eparation function\n    :return: string of the path to the file with the updated content", "x": 2100, "y": 450}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.mod_blocks_file_with_adjacent_words", "label": "mod_blocks_file_with_adjacent_words", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "LLM TRANSCRIPT PROCESSING", "title": "def mod_blocks_file_with_adjacent_words(blocks_file_path, num_adjacent_words):\n\nModifies the content of a file by adding a specified number of words from the previous and next blocks to each block.\n    Also adds a Markdown heading and content at the beginning of the new content.\n    :param blocks_file_path: string of the path to the file containing text blocks\n    :param num_adjacent_words: integer indicating the number of words to add from adjacent blocks\n    :return: None", "x": 2100, "y": 500}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.scall_replace_adjacent_words", "label": "scall_replace_adjacent_words", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "LLM TRANSCRIPT PROCESSING", "title": "def scall_replace_adjacent_words(blocks_file_path, prompt, adjacent_words, retain_delimiters=False, suffix_new=\u0027_scall-replace-adj\u0027):\n\nReplaces words adjacent to each block in a file with a language model processed version based on a given prompt.\n\n    :param blocks_file_path: string of the path to the file containing text blocks\n    :param prompt: string of the prompt to process each block with\n    :param adjacent_words: integer indicating the number of words to add from adjacent blocks\n    :param retain_delimiters: boolean indicating whether to retain original block delimiters\n    :param suffix_new: string of the suffix to append to the new file name\n    :return: string of the path to the modified file", "x": 2100, "y": 550}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.create_transitions_file", "label": "create_transitions_file", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "LLM TRANSCRIPT PROCESSING", "title": "def create_transitions_file(file_path, split_file_function, prompt, *args, **kwargs):\n\nCreates a file with transitions between blocks processed by a language model based on a given prompt.\n\n    :param file_path: string of the path to the original file\n    :param split_file_function: function used to separate the original file into blocks\n    :param prompt: string of the prompt to process each block with\n    :return: string of the path to the transitions file", "x": 2100, "y": 600}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "llm.QA GENERATION", "label": "QA GENERATION", "module": "llm.py", "shape": "box", "size": 30, "x": 2100, "y": 650}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_speaker", "label": "tools_qa_speaker", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "QA GENERATION", "title": "def tools_qa_speaker(speaker):\n\nGenerate a list of tools for question and answer extraction based on the speaker\u0027s response.\n\n    :param speaker: string of the speaker\u0027s name whose responses are being analyzed\n    :return: list of dictionaries containing tool configurations for QA extraction", "x": 2100, "y": 700}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.fcall_qa_speaker", "label": "fcall_qa_speaker", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "QA GENERATION", "title": "def fcall_qa_speaker(block_file_path, speaker, fcall_prompt, suffix_new=\"_qa\"):  # skip unittests because called below\n\nProcesses a transcript file already sectioned into blocks to generate new question and answer file.\n    Answers are based on the speaker segments of the provided speaker.\n    Uses OpenAI function calling.\n\n    :param block_file_path: string of the path to the _blocks file to be processed.\n    :param speaker: string of the speaker\u0027s name for the answers in QA.\n    :param fcall_prompt: string of the prompt to be used for function calling.\n    :param suffix_new: string of the suffix to be appended to the original filename for the new file. Defaults to \u0027_qa\u0027.\n    :return: string of the path to the newly created file with QA", "x": 2100, "y": 750}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.create_qa_file_select_speaker", "label": "create_qa_file_select_speaker", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "QA GENERATION", "title": "def create_qa_file_select_speaker(file_path, speaker, fcall_prompt):\n\nProcesses a _prepqa file to generate QA question and answer blocks using OpenAI LLM function calling.\n\n    :param file_path: string of the path to the _prepqa transcript file to be processed.\n    :param speaker: string of the speaker\u0027s name to be used in processing.\n    :return: None.", "x": 2100, "y": 800}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "llm.QA INCREMENTAL", "label": "QA INCREMENTAL", "module": "llm.py", "shape": "box", "size": 30, "x": 2100, "y": 850}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_incremental_2", "label": "tools_qa_incremental_2", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "QA INCREMENTAL", "title": "def tools_qa_incremental_2():\n\nYou are an expert text analyzer trained in identifying questions and answers in transcripts of dialogue, specifically for FDA Town Hall meetings on COVID-19 diagnostics. Your role is to extract the **next** relevant question-answer pair from the given transcript chunk, while also identifying its location within the text with precision. This is an incremental process: each time you produce a QA pair, you must identify exactly which characters in the transcript it corresponds to, so that subsequent requests can continue from beyond that position without overlap or duplication.\n\nYour **primary goals** when extracting each question-answer pair:\n1. **Prevent Duplication**  \n   - Each transcript chunk should yield at most one new or distinct Q\u0026A if it involves the same question, the same speaker, or the same snippet previously captured.\n   - If the text is essentially continuing or clarifying the same question-answer pair (same speaker, same context, no new question asked), do not produce a separate QA pair. Instead, merge it into the previous QA or skip it.\n   - Skip or merge any \u0027implied\u0027 question if it simply rehashes a previously extracted question or answer. Do not produce multiple QAs for repeated or partial references to the same question or the same speaker\u0027s statement.\n\n2. **Identify \u0026 Label Speakers and Their Roles**  \n   - For example, use \u0027Tim Stenzel (FDA IVD Director):\u0027 or \u0027Shannon Clark (UserWise Consulting):\u0027.  \n   - If a speaker\u0027s question is truly separate, it should become a distinct QA pair. If it is a minor clarifying follow-up, merge it into the previous QA if possible.\n\n3. **Capture Verbatim Text on a Single Line**  \n   - Provide a \u0027VERBATIM QUESTION\u0027 and \u0027VERBATIM ANSWER\u0027 as continuous text without line breaks or extra speaker labels embedded inside. Eliminate \u0027um,\u0027 \u0027uh,\u0027 repeated words, or crosstalk noise only if they disrupt clarity; otherwise, keep the text as close to verbatim as possible.\n   - Provide a \u0027CLARIFIED QUESTION\u0027 and \u0027CLARIFIED ANSWER\u0027 that rephrase or clean up the language for clarity, **but do not** change the meaning.\n   - If the speaker never actually asks a question but is giving new, important regulatory or legal info not captured in a prior QA pair, you may label it as \u0027IMPLIED QUESTION\u0027 / \u0027IMPLIED ANSWER.\u0027 However, do this only if it is clearly a separate, substantive piece of info that was not already covered. Do not produce multiple implied questions for partial or repeated quotes from the same speaker or the same text chunk.\n\n4. **Location Reporting (Transcript Start/End Positions)**  \n   - Precisely identify the start and end character positions in the provided transcript for each **verbatim** question and answer.  \n   - Ensure these positions align exactly with the extracted text, so future incremental requests can skip ahead to the next chunk.\n\n5. **Exclusions \u0026 Focus**  \n   - **Exclude** housekeeping/orchestration and meeting management (e.g., \u0027next steps in the meeting\u0027, \u0027Moderator,\u0027 \u0027Coordinator\u0027 instructions about lines being muted, \u0027press star-1,\u0027 teleconference issues, or feedback survey reminders).  \n   - **Exclude** repeated disclaimers that \u0027FDA can\u0027t speak about specific submissions under review.\u0027  \n   - **Focus** on technical, procedural, or legal content about COVID-19 diagnostics, test development, validation, labeling, and regulatory processes.\n\n6. **One QA per Speaker Turn**\n   - By default, a single speaker\u0027s turn (plus any immediate FDA response) should become one QA pair unless the speaker explicitly asks multiple distinct questions.\n   - If the same speaker\u0027s turn includes meandering or repeated questions, condense them into one QA if they address the same overall topic.\n   - Example: If a speaker says: \u0027I have a question about in silico cross-reactivity. Also, do we need new data for interfering substances?\u0027 treat that entire turn as one question.\n\n7. **Minor Clarifications or Follow-Ups**\n   - If a speaker or the FDA official continues talking but does not pose a new distinct question, do not create a new QA pair.\n   - If it\u0027s simply clarifying the same question (e.g., a short \u0027Yes, exactly\u0027 or \u0027That\u0027s correct\u0027), merge it into the existing QA pair or skip if it adds no new regulatory content.\n\n8. **Incremental Approach \u0026 Avoiding Over-Segmentation**  \n   - After extracting one QA pair, you stop at the exact \u0027TRANSCRIPT END POSITION.\u0027 The next time a request is made, you begin looking for a new question or important statement from that end position forward.\n   - Do not break out small or partial phrases from the same speaker answer or question into multiple QA pairs. If the question or answer is continuous (no separate speaker turn), it\u0027s a single QA.\n   - If it was partially extracted previously, skip it unless the newly revealed text truly adds a completely new question or significant content.\n\n9. **Minimize Implied Q\u0026A**\n   - If you already extracted a Q\u0026A covering the same statement from an Authority Speaker, do not create a second \u0027implied Q\u0026A.\u0027\n   - If the statement is basically repeating prior FDA guidance (e.g., \u0027We are open to off-label use\u2026\u0027 repeated), skip or merge it.\n\n10. **Review Flag**  \n    - If you are uncertain whether a piece of information is important enough to become a question-answer pair, include it, but set \u0027REVIEW FLAG: True.\u0027\n\n### **Output Format Example**\n\nFor each extraction, produce something like:\nCLARIFIED QUESTION: \u003cOne-sentence, cleaned-up question\u003e\nCLARIFIED ANSWER: \u003cOne-sentence, cleaned-up answer or best summary of the official FDA stance\u003e\nVERBATIM QUESTION: \u003cExact single-line text from the transcript, no newlines\u003e\nVERBATIM ANSWER: \u003cExact single-line text from the transcript, no newlines\u003e\nSPEAKER QUESTION: \u003cName and role\u003e\nSPEAKER ANSWER: \u003cName and role\u003e\nTRANSCRIPT START POSITION: \u003cinteger index in transcript\u003e\nTRANSCRIPT END POSITION: \u003cinteger index in transcript\u003e\nTOPICS: \u003cshort list of relevant topics\u003e\nREVIEW FLAG: \u003cTrue/False\u003e\n\n**Important:**  \n- Keep the \u0027VERBATIM QUESTION\u0027 and \u0027VERBATIM ANSWER\u0027 truly on one line each, removing speaker tags or line breaks.  \n- Do not repeat the same text chunk if it\u0027s already been extracted in a previous QA pair.  \n- Use your judgment to maintain clarity but remain faithful to the transcript.\n\nBy following these updated guidelines, your extraction will avoid repetition, properly scope incremental location offsets, and keep the Q\u0026A set tightly focused on the most critical technical and regulatory content from the FDA Town Hall.", "x": 2100, "y": 900}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "llm.**Output Format Example**", "label": "**Output Format Example**", "module": "llm.py", "shape": "box", "size": 30, "x": 2100, "y": 950}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_incremental_F", "label": "tools_qa_incremental_F", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def tools_qa_incremental_F():\n\nYou are an expert text analyzer trained in identifying questions and answers in transcripts of dialogue, specifically for FDA Town Hall meetings on COVID-19 diagnostics. Your role is to extract and clarify the next question-answer pair from the given transcript chunk.\n\nCore Requirements:\n1. DO NOT REPEAT ESSENTIALLY THE SAME QUESTION OR ANSWER from previous blocks\n2. Focus only on technical, procedural, or legal information\n3. Exclude meeting orchestration details (e.g., starting meeting, connection issues, speaker order)\n\nSpeaker Guidelines:\n- Authority Speakers are indicated by \u0027FDA\u0027 in their role description\n- Non-Authority Speaker statements require FDA acknowledgment\n- Speakers are identified by lines ending with colon or timestamp\n\nPosition Tracking:\n- Precisely identify start/end positions of extracted text in the transcript\n- This enables accurate progression and prevents duplicating content\n- Report positions relative to the start of the provided chunk\n\nIf unsure about information importance, include it but set review_flag to True.", "x": 2100, "y": 1000}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_incremental_4", "label": "tools_qa_incremental_4", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def tools_qa_incremental_4():\n\nYou are an expert text analyzer trained in identifying questions and answers in transcripts of dialogue, specifically for FDA Town Hall meetings on COVID-19 diagnostics. Your role is to extract and clarify the next question-answer pair from the given transcript chunk and previous questions.\n\nCore Requirement:\nDO NOT REPEAT ESSENTIALLY THE SAME QUESTION given the list of previous questions\n\nSpeaker Guidelines:\n- Authority Speakers are indicated by \u0027FDA\u0027 in their role description\n- Non-Authority Speaker statements require FDA acknowledgment\n- Speakers are identified by lines ending with colon or timestamp\n- Treat a single speaker\u0027s turn plus FDA response as one QA pair unless multiple distinct questions\n- Merge minor clarifications or follow-ups into existing QA rather than creating new pairs\n\nPosition Tracking:\n- Precisely identify start/end positions of extracted text in the transcript\n- This enables accurate progression and prevents duplicating content\n- Report positions relative to the start of the provided chunk\n\nContent Guidelines:\n- Focus on technical, procedural, or legal aspects of COVID-19 diagnostics, test development, validation, labeling\n- Minimize implied questions - only use for important new regulatory content not previously captured\n- Exclude meeting orchestration details (e.g., starting meeting, connection issues, speaker order)\n- Exclude repeated disclaimers about FDA not discussing specific submissions\n\nIf unsure about information importance, include it but set review_flag to True.", "x": 2100, "y": 1050}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_incremental_5", "label": "tools_qa_incremental_5", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def tools_qa_incremental_5():\n\nYou are an expert text analyzer trained in identifying questions and answers in transcripts of dialogue, specifically for FDA Town Hall meetings on COVID-19 diagnostics. Your role is to extract and clarify the next question-answer pair from the given transcript chunk and previous questions.\n\nCore Requirements:\n1. Identify the next question or important information from the provided transcript chunk\n2. Must come after the provided previous question-answer pair\n3. \n\n\n\nNEVER EXTRACT A QUESTION THAT COVERS THE SAME CORE TOPIC AND INFORMATION AS ANY PREVIOUS QUESTION\n2. If a new question seems too similar to previous ones, SKIP AHEAD in the transcript to find the next truly distinct topic\n3. When multiple questions discuss the same general topic only extract the FIRST comprehensive question-answer pair\n4. For follow-up questions or clarifications, merge them into the original answer rather than creating new QA pairs\n5. If no novel questions remain in the current chunk, set review_flag to True and move to the next chunk\n\nQuestion Diversity Guidelines:\n- Each question must introduce a completely new topic or regulatory aspect\n- Reject questions that merely rephrase or slightly extend previous questions\n- For multi-part discussions, combine related points into a single comprehensive QA pair\n- When in doubt about similarity, err on the side of skipping the question\n\nSpeaker Guidelines:\n- Authority Speakers are indicated by \u0027FDA\u0027 in their role description\n- Non-Authority Speaker statements require FDA acknowledgment\n- Speakers are identified by lines ending with colon or timestamp\n- Treat a single speaker\u0027s turn plus FDA response as one QA pair unless multiple distinct questions\n- Merge minor clarifications or follow-ups into existing QA rather than creating new pairs\n\nPosition Tracking:\n- Precisely identify start/end positions of extracted text in the transcript\n- This enables accurate progression and prevents duplicating content\n- Report positions relative to the start of the provided chunk\n\nContent Guidelines:\n- Focus on technical, procedural, or legal aspects of COVID-19 diagnostics, test development, validation, labeling\n- Minimize implied questions - only use for important new regulatory content not previously captured\n- Exclude meeting orchestration details (e.g., starting meeting, connection issues, speaker order)\n- Exclude repeated disclaimers about FDA not discussing specific submissions\n\nIf unsure about information importance, include it but set review_flag to True.", "x": 2100, "y": 1100}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_incremental_6", "label": "tools_qa_incremental_6", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def tools_qa_incremental_6():\n\nYou are an expert text analyzer trained in identifying questions and answers in transcripts of dialogue, specifically for FDA Town Hall meetings on COVID-19 diagnostics.\n\nYour Role:\n- Determine whether there is important content that should be extracted as one or more question-answer (QA) blocks, given a list of previous questions and the previous QA block.\n- If additional important content is present, extract and clarify one or more new Q\u0026A pairs from the provided transcript chunk.\n- If no additional important content is present, respond with \u0027NO NEW QA\u0027 for the clarified_question field and leave the other fields blank (empty strings) or zero.\n- Extract only new, distinct question-answer content that appears after the text already covered by the previous QA block. \n  - Do not duplicate a Q\u0026A already extracted from the same text segment. \n  - However, if a single answer covers multiple topics (and those topics are not yet captured in any previous question), you should create multiple QA pairs\u2014one for each distinct point.\n- Provide both verbatim and clarified versions of each question and answer to ensure thorough coverage and readability.\n\nCoverage \u0026 Percentage Guidance:\n- **Aim for comprehensive coverage** of the FDA\u2019s important regulatory and technical information. \n- If a transcript chunk introduces new or significant material not previously extracted, **create a new QA block.** \n- **Avoid overlap**: if a question has essentially the same meaning as a previous question, skip it.\n- **Include high-level updates**: Regulatory updates, newly authorized tests, or statements of FDA priority should be treated as \u201cimplied questions\u201d if they are not explicitly phrased as questions.\n- **Allow multiple questions** from a single turn or answer if there are clearly separate topics or points worth indexing.\n\nCore Requirements:\n1. DO NOT REPEAT QUESTIONS THAT COVER THE SAME CORE TOPIC AND INFORMATION as any in the provided previous-questions list.\n2. If a potential question is too similar to previous ones, skip it or return \u201cNO NEW QA\u201d for that segment.\n3. For multi-part discussions of the same topic, merge clarifications into one comprehensive QA pair. However, if an answer covers multiple unrelated points, **split** them into multiple QA pairs for clarity.\n4. If you determine there is no distinct new content for a given chunk, return \u0027NO NEW QA\u0027 (instructions below).\n\nSpeaker Guidelines:\n- Speakers are identified by lines ending with a colon, timestamp, or by a direct statement of their role (e.g., \u0027Dr. Smith (FDA):\u0027).\n- Authority Speakers are indicated by \u0027FDA\u0027 in their role description.\n- Non-Authority Speaker statements must be included in the clarified_answer field if they contain important details or are directly addressed by the FDA. If uncertain, set review_flag = True.\n\nPosition Tracking:\n- Precisely identify start/end positions of extracted text (verbatim) within the chunk.\n- Use these positions to prevent duplication and ensure incremental coverage.\n\nContent Guidelines:\n- Focus on **technical, procedural, or legal** aspects of COVID-19 diagnostics (test development, validation, labeling, etc.).\n- Exclude trivial meeting details (startup, speaker order).\n- If important FDA information is present but no explicit question is asked, generate an \u201cimplied\u201d question.\n- Whenever uncertain, set review_flag to True.\n\nVerbatim vs. Clarified Output:\n- Provide both verbatim_question and verbatim_answer, exactly as they appear (minus speaker labels and newlines).\n- Provide clarified_question and clarified_answer for readability, combining or splitting content *only* to improve clarity and coverage without contradicting the original meaning.\n\nOption to Return \u201cNO NEW QA\u201d:\n- If no new question is found, set \u0027clarified_question\u0027 to the exact string \u0027NO NEW QA\u0027 and leave other fields blank (empty strings) or zero.\n- Set \u0027review_flag\u0027 to True if uncertain whether new QA content is present, or False if obviously none remains.\n- If the previously extracted QA block is empty or nonexistent, parse all important content in the chunk as new Q\u0026A.\n\nRemember, **the user\u2019s application will index only the questions** for semantic search, so your clarified_question fields must capture all key points that a user might search for in the future. Avoid discarding or merging clearly separate topics into one question.\n\nYour output must strictly follow the schema. All fields are required, so if there is no new QA, fill them with the agreed-upon placeholders or zeros. The transcript will be processed in a progressive manner, each output forming part of a larger incremental extraction.", "x": 2100, "y": 1150}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.get_next_chunk", "label": "get_next_chunk", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def get_next_chunk(transcript, start_position, next_tokens):\n\nGet the next chunk of transcript to process, based on the algorithm specification.\n    \n    :param transcript: Complete transcript text.\n    :param start_position: Starting character position in the transcript.\n    :param next_tokens: Number of tokens to look ahead.\n    :return: Tuple of (chunk_text, end_position).", "x": 2100, "y": 1200}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.get_last_qa_block_start_position", "label": "get_last_qa_block_start_position", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def get_last_qa_block_start_position(qa_file_path):\n\nRead the last processed start position from the existing QA file.\n    \n    :param qa_file_path: String of the path to the QA file.\n    :return: Integer of the transcript start position, or 0 if not found.", "x": 2100, "y": 1250}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.fcall_qa_incremental", "label": "fcall_qa_incremental", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "**Output Format Example**", "title": "def fcall_qa_incremental(transcript, next_tokens, fcall_prompt, start_position, debug=True):\n\nProcesses a transcript string incrementally to extract the next question-answer pair using OpenAI function calling.\n    This function yields each QA block along with the current position in the transcript, allowing for incremental processing and resumption from the last processed position.  \n\n    :param transcript: string of the transcript content.\n    :param next_tokens: integer of the number of tokens to look ahead.\n 27verbatim_question\u0027: \n   - Using the provided question, find the exact text from the transcript section that corresponds to it.\n   - If the question is implied, set this to \u0027IMPLICIT\u0027 because the verbatim_answer field will contain the relevant text from the trancript.\n2. \u0027verbatim_answer\u0027: \n   - Provide the exact text of the answer from the transcript excerpt (minus speaker labels/newlines).\n   - Find the best answer possible from the transcript excerpt.\n   - This verbatim_answer field must be found and extracted from the transcript section text.\n3. \u0027clarified_answer\u0027: \n   - Provide a concise, edited restatement of the answer. Use \u0027FDA\u0027 where appropriate; do not include personal names.\n4. \u0027speaker_question\u0027: \n   - Name/role exactly as it appears in the transcript (preceding a colon or timestamp). \n   - If the question is implied from an authority speaker, set \u0027NOT APPLICABLE\u0027.\n5. \u0027speaker_answer\u0027: \n   - Name/role exactly as it appears in the transcript for the speaker who provides the answer. \n   - If the question is implicit, use the speaker\u2019s name who implied it.\n6. \u0027topics\u0027: \n   - List 1\u20133 brief topics addressed; if none, return an empty list [].\n7. \u0027review_flag\u0027: \n   - True if uncertain or incomplete; else False.\n\nReturn only a single JSON object, nothing else.", "x": 2400, "y": 600}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.tools_qa_qonly_blocks", "label": "tools_qa_qonly_blocks", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "QA BY SECTIONS - Q ONLY", "title": "def tools_qa_qonly_blocks():\n\nThis function schema returns a single QA block that addresses the final question from the transcript excerpt.\n    The \u0027clarified_question\u0027 field is removed, because the question is already provided and does not need clarification.", "x": 2400, "y": 650}, {"color": "#edc948", : "box", "size": 40, "submodule": "OLD PROMPTS", "title": "def tools_qonly_explicit_list():  # not tried - think this is incorrect format\n\nYou are an expert at identifying and clarifying explicitly asked questions in meeting transcripts.\n\nYour Role:\n- Extract and clarify all explicitly asked questions from the provided text\n- Only process questions marked by:\n  * Question marks\n  * Clear question phrases (\u0027Could you explain\u0027, \u0027I\u0027d like to ask\u0027, etc.)\n- Break multi-part questions into separate, individual questions\n- Create clear, concise versions of each question that preserve technical accuracy\n\nContent Guidelines:\n- Focus on technical, procedural, or legal questions about COVID-19 diagnostics\n- Exclude trivial questions (e.g., \u0027Can you hear me?\u0027, \u0027Who\u0027s next?\u0027)\n- Do not include implied questions or statements that could be questions\n- Do not mention specific speaker names in the questions\n- Remove unnecessary context while preserving key technical terms\n\nQuestion Clarification Rules:\n- Make questions concise and direct\n- Break compound questions into separate individual questions\n- Preserve all technical terms and regulatory references\n- Standardize terminology while maintaining accuracy\n- Remove conversational elements (\u0027you know\u0027, \u0027I was wondering\u0027, etc.)\n\nRedundancy Prevention:\n- Avoid duplicate questions even if asked by different speakers\n- If similar questions are asked with slightly different focus, preserve each distinct aspect\n- Combine closely related questions that seek the same information\n- When questions build on each other, maintain the logical distinction between them", "x": 2400, "y": 1400}, {"color": "#ffffff", "font": {"size": 18}, "group": "submodule", "id": "llm.NOT USED - LLM SECTIONS", "label": "NOT USED - LLM SECTIONS", "module": "llm.py", "shape": "box", "size": 30, "x": 2400, "y": 1450}, {"color": "#edc948", "font": {"size": 14}, "group": "function", "id": "llm.scall_meeting_sections", "label": "scall_meeting_sections", "line": null, "module": "llm.py", "shape": "box", "size": 40, "submodule": "NOT USED - LLM SECTIONS", "title": "def scall_meeting_sections(file_path, system_prompt, heading=\"### transcript\"):\n\nYou are a precise transcript analyzer. Your task is to identify natural section breaks (\u0027---\u0027) in FDA town hall transcripts based on conversation flow and speaker transitions.\n\n\u003c\u003c COUNTING RULES \u003e\u003e\n1. Count lines sequentially from the start of the transcript:\n   - Each new line (marked by a line break) counts as one line\n   - Speaker names like \u0027Coordinator:\u0027 or \u0027Tim Stenzel (FDA IVD Director):\u0027 count as their own line\n   - Each paragraph of speech counts as its own line\n   - Blank lines count as their own line number\n   - The delimiter (\u0027---\u0027) will replace an existing blank line\n\n2. Example of a natural section break:\n   \u0027Tim Stenzel (FDA IVD Director):\u0027\n   \u0027That\u0027s a good question. [answer content]\u0027\n   \u0027Thank you for your question.\u0027\n   \u0027\u0027 (blank line) \u003c-- This is where a delimiter should go\n   \u0027Coordinator: Our next question comes from...\u0027\n\n\u003c\u003c SECTION BREAK RULES \u003e\u003e\n1. Add ONE delimiter at a blank line when these logical conditions are met:\n   - A complete Q\u0026A exchange has concluded (question asked and fully answered)\n   - The conversation is transitioning to a new participant or topic\n   - There\u0027s a natural pause in the dialogue\n\n2. Key transition indicators:\n   - After the opening remarks/introduction section ends\n   - When the Coordinator introduces a new questioner\n   - After a complete answer, before a new topic begins\n   - When switching between distinct discussion topics\n   - Before \u0027Coordinator: Our next question comes from...\u0027\n   - After concluding remarks on one topic, before starting another\n\n s primarily by similarity score and returns the top `num_chunks`.\n    Converts \u0027STARS\u0027 to integer and sets to 0 if blank, but doesn\u0027t use it for sorting.\n\n    :param fetched_qa_chunks: dictionary of fetched question chunks from Pinecone.\n    :param retrieved_ids_scores: dictionary of retrieved IDs with their similarity scores.\n    :param num_chunks: integer specifying the number of chunks to return.\n    :return: list of sorted chunks.", "x": 2700, "y": 1350}, {"color": "#ff9da7", "font": {"size": 14}, "group": "function", "id": "rag.parse_chunks", "label": "parse_chunks", "line": null, "module": "rag.py", "shape": "box", "size": 40, "submodule": "QRAG", "title": "def parse_chunks(chunks, simscores):\n\nParses a list of chunks and returns a list of dictionaries containing formatted chunk information.\n    Maps QA block fields (CLARIFIED_QUESTION/ANSWER) to standard QUESTION/ANSWER fields.\n\n    :param chunks: list of chunk metadata dictionaries.\n    :param simscores: dictionary of similarity scores keyed by chunk id.\n    :return: list of parsed chunk dictionaries.", "x": 2700, "y": 1400}, {"color": "#ff9da7", "font": {"size": 14}, "group": "function", "id": "rag.qrag_routing_call", "label": "qrag_routing_call", "line": null, "module": "rag.py", "shape": "box", "size": 40, "submodule": "QRAG", "title": "def qrag_routing_call(user_question, vector_index_name, num_chunks, routes_dict, date_range=None, routes_bounds=[0.3, 0.9], llm_model=DEFAULT_LLM_MODEL, user_id=\u0027default\u0027, user_context=None, qrag_version=\"1.0\"):\n\nRoutes a user question through a question retrieval augmented generation (QRAG) process.\n\n    :param user_question: str, the question asked by the user.\n    :param vector_index_name: str, name of the vector index to search.\n    :param num_chunks: int, number of chunks to retrieve and process.\n    :param routes_dict: dict, containing routing information and templates.\n    :param date_range: optional list of two dates function getGraphBoundingBox() {
  let allNodes = network.body.data.nodes.get();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  allNodes.forEach(node => {
      let nodeBoundingBox = network.getBoundingBox(node.id);
      if (nodeBoundingBox.left < minX) minX = nodeBoundingBox.left;
      if (nodeBoundingBox.top < minY) minY = nodeBoundingBox.top;
      if (nodeBoundingBox.right > maxX) maxX = nodeBoundingBox.right;
      if (nodeBoundingBox.bottom > maxY) maxY = nodeBoundingBox.bottom;
  });

  return { 
    minX: Math.round(minX), 
    minY: Math.round(minY), 
    maxX: Math.round(maxX), 
    maxY: Math.round(maxY) 
  };
}

function autoFitGraph() {
  if (!network || !network.body || !network.body.data.nodes.length) {
    console.error('Network is not ready or empty.');
    return;
  }

  const TOP_MARGIN = 30;

  const container = network.canvas.frame;
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  console.log(`Auto Scale Graph`);
  console.log(`   Container dimensions - Width: ${containerWidth}, Height: ${containerHeight}`);

  const graphBoundingBox = getGraphBoundingBox();
  const graphWidth = graphBoundingBox.maxX - graphBoundingBox.minX;
  const graphHeight = graphBoundingBox.maxY - graphBoundingBox.minY;
  console.log(`   Graph bounding dimensions: {width: ${graphWidth}, height: ${graphHeight}}`);

  const scaleX = containerWidth / graphWidth;
  const scaleY = (containerHeight - TOP_MARGIN) / graphHeight;
  const scale = Math.min(scaleX, scaleY);
  console.log(`   Scale factors - scaleX: ${scaleX.toFixed(3)}, scaleY: ${scaleY.toFixed(3)}, scale: ${scale.toFixed(3)}`);

  const offsetX = (graphBoundingBox.minX + graphBoundingBox.maxX) / 2;
  const offsetY = ((graphBoundingBox.minY + graphBoundingBox.maxY) / 2) - TOP_MARGIN / 2;
  console.log(`   Offsets - offsetX: ${offsetX}, offsetY: ${offsetY}`);

  network.moveTo({
    position: {x: offsetX, y: offsetY},
    scale: scale,
    animation: false
  });
}

// ### FOCUS NODE
function getFunctionNodesFromModuleOrSub(moduleOrSubID) {  // helper that returns array of function node IDs
  var allNodes = nodes.get();
  var moduleOrSubIDNode = nodes.get(moduleOrSubID);
  var functionNodeIds = [];

  if (moduleOrSubIDNode.group === 'module') {
    console.log(`Focus on module node: ${moduleOrSubIDNode.id}`);
    functionNodeIds = allNodes
      .filter(node => node.group === 'function' && node.module === moduleOrSubIDNode.id)
      .map(node => node.id);
  } else if (moduleOrSubIDNode.group === 'submodule') {
    var submoduleName = moduleOrSubIDNode.id.split('.').pop(); // Strip everything before and including the last dot
    console.log(`Focus on submodule node: ${moduleOrSubIDNode.id}`);
    console.log(`  Submodule name: ${submoduleName}`);
    functionNodeIds = allNodes
      .filter(node => node.group === 'function' && node.submodule === submoduleName)
      .map(node => node.id);
  }

  console.log(`  Number of function nodes: ${functionNodeIds.length}`);

  return functionNodeIds;
}

function tracebackFunction(nodeID) {  // returns array of node IDs reachable thru outgoing edges excluding input node
  var allEdges = edges.get();
  var tracedNodeIDs = new Set();
  var nodesToProcess = [nodeID];

  while (nodesToProcess.length > 0) {
    var currentNodeID = nodesToProcess.pop();

    // Find all outgoing edges from the current node
    var outgoingEdges = allEdges.filter(edge => edge.from === currentNodeID);

    // Add the target nodes of these edges to the processing queue
    outgoingEdges.forEach(edge => {
      if (!tracedNodeIDs.has(edge.to) && edge.to !== nodeID) {
        // Check if the edge is a controller_to_worker edge and if it should be traced
        if (edge.type === 'controller_to_worker' && edge.applies_to_functions && !edge.applies_to_functions.includes(nodeID)) {
          return;
        }
        tracedNodeIDs.add(edge.to);
        nodesToProcess.push(edge.to);
      }
    });
  }

  console.log(`  Number of nodes traced back: ${tracedNodeIDs.size}`);
  return Array.from(tracedNodeIDs);
}

function focusNodes(nodeId) {
  var focusedNode = nodes.get(nodeId);
  var allEdges = edges.get();
  var functionNodeIds = [];
  var parentNodeIds = [];

  resetFocus()

  // Select focus for all nodes in a module or sub or just the single input node
  if (focusedNode.group === 'module' || focusedNode.group === 'submodule') {
    functionNodeIds = getFunctionNodesFromModuleOrSub(focusedNode.id);
  } else if (focusedNode.group === 'function') {
    functionNodeIds = [nodeId];
  }

  // Modify border and font for all focus function nodes
  functionNodeIds.forEach(function(nodeId) {
    console.log(`Modifying style of focus function node: ${nodeId}`);
    var node = nodes.get(nodeId);
    node.borderWidth = 4;
    node.font = { 
      ...node.font, 
      bold: true
    };
    nodes.update(node);
  });
    
  // Find parent nodes (immediate callers of the focus nodes)
  parentNodeIds = allEdges
    .filter(edge => functionNodeIds.includes(edge.to))
    .map(edge => edge.from);

  // Show and style edges
  allEdges.forEach(function(edge) {
    if (functionNodeIds.includes(edge.to) && parentNodeIds.includes(edge.from)) {
      // Incoming edges to the focus nodes (from parent nodes)
      edge.hidden = false;
      edge.dashes = [5, 5]; // Dotted line
    } else {
      edge.hidden = true;
    }
  });

  // Trace back function nodes and update functionNodeIds
  let tracedNodeIds = new Set(functionNodeIds);
  functionNodeIds.forEach(function(nodeId) {
    tracebackFunction(nodeId).forEach(id => tracedNodeIds.add(id));
  });
  functionNodeIds = Array.from(tracedNodeIds);

  // Show outgoing edges for all traced nodes
  var directChildNodeIds = allEdges
    .filter(edge => edge.from === nodeId)
    .map(edge => edge.to);

  allEdges.forEach(function(edge) {
    if (functionNodeIds.includes(edge.from)) {
      // Outgoing edges from any function in the traced nodes
      edge.hidden = false;
      edge.dashes = false; // Solid line
      edge.color = 'blue';
      if (!directChildNodeIds.includes(edge.to)) {
        edge.color = 'black';
      }
    }
  });

  // Hide controller_to_worker edges that do not apply to the current focus node
  allEdges.forEach(function(edge) {
    if (edge.type === 'controller_to_worker' && edge.applies_to_functions && !edge.applies_to_functions.includes(nodeId)) {
      edge.hidden = true;
    }
  });

  edges.update(allEdges);

  // Reapply dimming based on current checkbox state
  dimUnconnectedNodes(dimUnconnectedCheckbox.checked);

  network.redraw();
}

// ### ALIGN NODES LEFT
function alignNodesLeft() {
  console.log("Aligning non-module nodes to the left...");
  var allNodes = nodes.get();
  var nonModuleNodes = allNodes.filter(node => node.group !== 'module');
  var nodesToUpdate = [];

  if (nonModuleNodes.length === 0) {
    console.log("No non-module nodes found.");
    return;
  }

  // Group nodes by their column for alignment
  var columnGroups = {};
  allNodes.forEach(node => {
    var nodeBox = network.getBoundingBox(node.id);
    var nodeLeftEdge = Math.round(node.x - (nodeBox.right - nodeBox.left) / 2);
    var columnKey = Math.round(node.x); // Use rounded x-coordinate as a key for grouping

    if (!columnGroups[columnKey]) {
      columnGroups[columnKey] = {
        leftEdge: nodeLeftEdge,
        nodes: []
      };
    }

    columnGroups[columnKey].nodes.push(node);

    // Update the leftmost edge if this node is further left
    if (nodeLeftEdge < columnGroups[columnKey].leftEdge) {
      columnGroups[columnKey].leftEdge = nodeLeftEdge;
    }
  });

  // Align all nodes in each column to the leftmost edge
  Object.values(columnGroups).forEach(group => {
    group.nodes.forEach(node => {
      var nodeBox = network.getBoundingBox(node.id);
      var nodeLeftEdge = Math.round(node.x - (nodeBox.right - nodeBox.left) / 2);
      var shiftX = group.leftEdge - nodeLeftEdge;

      if (node.group === 'function') {
        node.x += shiftX; // Shift the x position to align with the leftmost node with an additional offset
      } else {
        node.x += shiftX - 20; // Shift the x position to align with the leftmost node without additional offset
      }
      nodesToUpdate.push(node);
    });
  });

  if (nodesToUpdate.length > 0) {
    nodes.update(nodesToUpdate);
    network.fit();
    console.log(`${nodesToUpdate.length} nodes updated and aligned.`);
  } else {
    console.log("No nodes were updated.");
  }
}

// ### DIM UNCONNECTED NODES
function dimUnconnectedNodes(checked) {
    var allNodes = network.body.data.nodes.get();
    var nodesToUpdate = [];
    var connectedNodeCount = 0;
    var moduleToFunctions = {};  // Track functions per module
    var moduleConnectivity = {}; // Track connected functions per module

    // Initialize module tracking
    allNodes.forEach(function(node) {
        if (node.group === 'module') {
            moduleToFunctions[node.id] = 0;
            moduleConnectivity[node.id] = 0;
        }
        if (node.group === 'function') {
            let moduleId = node.module;
            moduleToFunctions[moduleId] = (moduleToFunctions[moduleId] || 0) + 1;
        }
    });

    // First pass: determine function node connectivity
    allNodes.forEach(function(node) {
        if (node.group === 'function') {
            if (checked) {
                var connectedEdges = network.getConnectedEdges(node.id).filter(edgeId => {
                    var edge = network.body.data.edges.get(edgeId);
                    return edge.hidden !== true;
                });

                if (connectedEdges.length > 0) {
                    node.opacity = 1;
                    moduleConnectivity[node.module]++;
                    connectedNodeCount++;
                } else {
                    node.opacity = 0.2;
                }
            } else {
                node.opacity = 1;
                moduleConnectivity[node.module]++;
            }
            nodesToUpdate.push(node);
        }
    });

    // Second pass: update module nodes based on their functions' connectivity
    allNodes.forEach(function(node) {
        if (node.group === 'module') {
            if (checked) {
                // Dim module if all its functions are dimmed or if it has no functions
                let totalFunctions = moduleToFunctions[node.id] || 0;
                let connectedFunctions = moduleConnectivity[node.id] || 0;
                node.opacity = (totalFunctions > 0 && connectedFunctions > 0) ? 1 : 0.2;
            } else {
                node.opacity = 1;
            }
            nodesToUpdate.push(node);
        }
    });

    console.log(`Dimming unconnected nodes for all but ${connectedNodeCount} nodes.`);
    network.body.data.nodes.update(nodesToUpdate);
    network.redraw();
}
