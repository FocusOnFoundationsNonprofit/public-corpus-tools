<!-- START OF FILE webflow-qrag-input-component-date-embed.html -->
<!-- deploy: copy to any QRAG page > click on embed element > Edit Pencil icon > Settings Gear icon > paste all -->
<!-- contains: frontend component containing user nicename input field, num chunks input field, and question submission UI -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />



<div class="qrag-input-component">

  <!-- User enters their name -->
  <div class="nicename-container">
    <textarea 
      class="nicename-textarea"
      placeholder="Enter your name here please"
      rows="1"></textarea>
  </div>

  <!-- User selects the number of chunks -->
  <div class="num-chunks-container">
    <span class="num-chunks-label">Choose the number of quoted selections:</span>
    <div class="num-chunks-options">
      <span class="num-chunks-option" data-value="2">2</span>
      <span class="num-chunks-option" data-value="3">3</span>
      <span class="num-chunks-option" data-value="5">5</span>
      <span class="num-chunks-option" data-value="10">10</span>
      <span class="num-chunks-option" data-value="20">20</span>
    </div>
  </div>

  <!-- New Date Range Selection -->
  <div class="date-range-container">
    <span class="num-chunks-label">Select date range:</span>
    <label for="start-date">From:</label>
    <input type="date" id="start-date" class="date-input">
    <label for="end-date">To:</label>
    <input type="date" id="end-date" class="date-input">
  </div>

  <!-- User enters their question -->
  <div class="botsubmit-container">
    <p class="botsubmit-error"></p>
    <textarea 
      class="botsubmit-textarea"
      placeholder="Enter your question here"
      rows="1"></textarea>
    <button class="primary-button w-button botsubmit-button">
      <span class="material-symbols-rounded botsubmit-button-icon">arrow_upward</span>
    </button>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var fileInfoSiteBody = `webflow-qrag-input-component-date-embed.html   1-23 0443 major refactor of date range and num chunks`;
    console.log('Loading JavaScript for QRAG Input Component Embed: ', fileInfoSiteBody);

    // Find parent BotContainer and set date range visibility
    const qragInputComponent = document.querySelector('.qrag-input-component');
    const botContainer = qragInputComponent.closest('[id^="container_"]');
    
    // Define num chunks variables and functions first
    const numChunksOptions = qragInputComponent.querySelectorAll('.num-chunks-option');
    const defaultNumChunksValue = '3';
    let selectedNumChunksValue = sessionStorage.getItem('num-chunks') || defaultNumChunksValue;

    function updateSelectedOption(selectedElement) {
        numChunksOptions.forEach(option => option.classList.remove('selected'));
        selectedElement.classList.add('selected');
        selectedNumChunksValue = selectedElement.getAttribute('data-value');
        sessionStorage.setItem('num-chunks', selectedNumChunksValue);
        console.log('Selected num chunks value:', selectedNumChunksValue);
    }

    if (botContainer) {
        const containerId = botContainer.id;
        const showDateRange = containerId.includes('fda-townhalls');
        
        // Set the data attribute
        qragInputComponent.setAttribute('data-show-date-range', showDateRange);
        
        // Initialize date range inputs and set fixed limits
        const startDate = qragInputComponent.querySelector('#start-date');
        const endDate = qragInputComponent.querySelector('#end-date');
        const minAllowedDate = '2020-03-02';
        const maxAllowedDate = '2023-04-26';
        
        // Set the min/max constraints
        if (startDate && endDate) {
            startDate.min = minAllowedDate;
            startDate.max = maxAllowedDate;
            endDate.min = minAllowedDate;
            endDate.max = maxAllowedDate;
            
            // Reset non-user info items to defaults based on page type
            if (showDateRange) {
                // FDA page - set date range defaults
                sessionStorage.setItem('qrag-start-date', minAllowedDate);
                sessionStorage.setItem('qrag-end-date', maxAllowedDate);
                startDate.value = minAllowedDate;
                endDate.value = maxAllowedDate;
                
                // Add event listeners for date changes
                startDate.addEventListener('change', function() {
                    endDate.min = this.value;
                    if (endDate.value && endDate.value < this.value) {
                        endDate.value = this.value;
                    }
                    sessionStorage.setItem('qrag-start-date', this.value);
                    sessionStorage.setItem('qrag-end-date', endDate.value);
                    console.log('Start date changed:', this.value);
                });

                endDate.addEventListener('change', function() {
                    startDate.max = this.value;
                    if (startDate.value && startDate.value > this.value) {
                        startDate.value = this.value;
                    }
                    sessionStorage.setItem('qrag-start-date', startDate.value);
                    sessionStorage.setItem('qrag-end-date', this.value);
                    console.log('End date changed:', this.value);
                });
            } else {
                // Non-FDA page - clear date range and disable inputs
                sessionStorage.removeItem('qrag-start-date');
                sessionStorage.removeItem('qrag-end-date');
                const dateRangeContainer = qragInputComponent.querySelector('.date-range-container');
                if (dateRangeContainer) {
                    dateRangeContainer.style.display = 'none';
                    startDate.disabled = true;
                    endDate.disabled = true;
                }
            }
        }

        // Reset num_chunks to default for all pages
        sessionStorage.setItem('num-chunks', defaultNumChunksValue);
        
        // Update UI to match new session storage values
        numChunksOptions.forEach(option => {
            if (option.getAttribute('data-value') === defaultNumChunksValue) {
                updateSelectedOption(option);
            }
        });
        
        console.log(`Date range visibility set to ${showDateRange} for container ${containerId}`);
    }

    // Initialize the UI with the stored or default value
    numChunksOptions.forEach(option => {
        if (option.getAttribute('data-value') === selectedNumChunksValue) {
            updateSelectedOption(option);
        }
    });

    // Add click event listeners to chunk options
    numChunksOptions.forEach(option => {
        option.addEventListener('click', function() {
            updateSelectedOption(this);
        });
    });

    // Expose selected chunks value globally
    window.getSelectedNumChunksValue = function() {
        return sessionStorage.getItem('num-chunks') || defaultNumChunksValue;
    };

    // Initialize nicename from sessionStorage if present
    const storedNiceName = sessionStorage.getItem('userNiceName');
    const nicenameTextarea = qragInputComponent.querySelector('.nicename-textarea');
    if (storedNiceName) {
        nicenameTextarea.value = storedNiceName;
        console.log('Populated nicename from sessionStorage:', storedNiceName);
    }

    // Expose date range values globally
    window.getSelectedDateRange = function() {
        const startDate = qragInputComponent.querySelector('#start-date');
        const endDate = qragInputComponent.querySelector('#end-date');
        return {
            startDate: startDate?.value || null,
            endDate: endDate?.value || null
        };
    };

    async function fetchIPAddress() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            console.error('Error fetching IP address:', error);
            return null;
        }
    }

    let lastSubmittedName = sessionStorage.getItem('userNiceName') || '';

    window.handleNiceNameSubmission = async function() {
        // Add consent check at the start
        if (!checkPrivacyConsent()) {
            const errorElement = document.querySelector('.botsubmit-error');
            showConsentError();
            return;
        }

        const errorElement = document.querySelector('.botsubmit-error');
        const rawNicename = nicenameTextarea.value;
        const fieldLabel = 'User NiceName Input';

        // Use the new validateAndSanitizeInput function from webflow-fof-site-body.js
        // maxUserNameLength and validateAndSanitizeInput are defined in that file and available globally
        const nameCheck = validateAndSanitizeInput(rawNicename, maxUserNameLength, fieldLabel, 'INPUT_TYPE_NAME');

        if (!nameCheck.success) {
            // Validation failed: suspicious or empty input
            // If empty or suspicious, revert to last valid name
            nicenameTextarea.value = lastSubmittedName;

            if (errorElement && nameCheck.messages.length > 0) {
                errorElement.textContent = nameCheck.messages.join(' ');
                errorElement.style.display = 'block';
                setTimeout(() => { errorElement.style.display = 'none'; }, 3000);
            }
            return;
        }

        // Update the textarea with sanitized value immediately
        nicenameTextarea.value = nameCheck.value;

        // If name is valid and changed
        if (nameCheck.value !== lastSubmittedName) {
            try {
                sessionStorage.setItem('userNiceName', nameCheck.value);
                console.log('handleNiceNameSubmission - NiceName stored:', nameCheck.value);

                // Show info messages (e.g. truncated or invalid chars removed)
                if (nameCheck.messages.length > 0) {
                    if (errorElement) {
                        errorElement.textContent = nameCheck.messages.join(' ');
                        errorElement.style.display = 'block';
                        setTimeout(() => { errorElement.style.display = 'none'; }, 3000);
                    }
                }

                let ipAddress = sessionStorage.getItem('userIPAddress');
                if (!ipAddress) {
                    ipAddress = await fetchIPAddress();
                    if (ipAddress) {
                        sessionStorage.setItem('userIPAddress', ipAddress);
                        console.log('handleNiceNameSubmission - IP Address stored:', ipAddress);
                    }
                }

                const inputUserEmail = sessionStorage.getItem('inputUserEmail') || '';
                const emailListSignupChecked = sessionStorage.getItem('emailListSignupChecked');
                const privacyConsent = sessionStorage.getItem('privacyConsent') || '';

                console.log('handleNiceNameSubmission - Calling hash-store with:', {
                    userNiceName: nameCheck.value,
                    userIPAddress: ipAddress, 
                    inputUserEmail,
                    emailListSignupChecked,
                    eventType: 'submit_user_nicename',
                    privacyConsent
                });

                // callHashStore is defined in webflow-fof-site-body.js
                const hashedValues = await callHashStore(
                    nameCheck.value,
                    ipAddress, 
                    inputUserEmail,
                    emailListSignupChecked,
                    'submit_user_nicename',
                    privacyConsent
                );

                console.log('handleNiceNameSubmission - Received hashed values:', hashedValues);

                // Update lastSubmittedName
                lastSubmittedName = nameCheck.value;

            } catch (error) {
                console.error('handleNiceNameSubmission - Error:', error);
                if (errorElement) {
                    errorElement.textContent = 'There was an error processing your information. Please try again.';
                    errorElement.style.display = 'block';
                    setTimeout(() => {
                        errorElement.style.display = 'none';
                    }, 3000);
                }
            }
        }
    }

    // Submit on Enter
    nicenameTextarea.addEventListener('keypress', async (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            await handleNiceNameSubmission();
        }
    });

    // Submit on blur if changed
    nicenameTextarea.addEventListener('blur', async (event) => {
      // Add a small delay to ensure privacy consent is set first
      await new Promise(resolve => setTimeout(resolve, 50));
      
      // Check consent status directly
      if (typeof checkPrivacyConsent === 'function' && checkPrivacyConsent()) {
          await handleNiceNameSubmission();
      } else {
          // Only show error if not clicking consent checkbox
          const activeElement = document.activeElement;
          const isConsentBox = activeElement?.closest('.privacy-consent-box');
          if (!isConsentBox) {
              showConsentError();
          }
      }
    });
  });
</script>

<!-- END OF FILE webflow-qrag-input-component-date-embed.html -->
